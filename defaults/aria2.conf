# aria2.conf — NewFreedeck 下载引擎
continue=true
max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=1M
max-tries=0
retry-wait=5
connect-timeout=10
timeout=30
allow-overwrite=false
auto-file-renaming=false
file-allocation=trunc
disk-cache=32M
check-integrity=true
always-resume=true
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-secret=newfreedeck
log-level=warn